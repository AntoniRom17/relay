[workspace]
resolver = "2"
default-members = ["crates/relay-cli"]
members = [
  "crates/relay-auth",
  "crates/relay-cache",
  "crates/relay-cli",
  "crates/relay-config",
  "crates/relay-control",
  "crates/relay-core",
  "crates/relay-demo",
  "crates/relay-limits",
  "crates/relay-observability",
  "crates/relay-proxy",
  "crates/relay-routing",
  "crates/relay-tls",
  "crates/relay-upstream",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Antoni Roman"]
license = "Apache-2.0"
repository = "https://github.com/AntoniRom17/relay"
homepage = "https://github.com/AntoniRom17/relay"
keywords = ["api-gateway", "reverse-proxy", "http", "tokio", "rust"]
categories = ["network-programming", "web-programming::http-server"]

[workspace.dependencies]
anyhow = "1.0"
arc-swap = "1.7"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
criterion = "0.8"
dashmap = "6.1"
futures-util = "0.3"
hex = "0.4"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.7", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "server", "server-auto", "tokio"] }
jsonwebtoken = "11.1"
prometheus = "0.14"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
proptest = "1.7"
rand = "0.9"
redis = { version = "1.7", features = ["aio", "connection-manager", "script", "tokio-comp"], default-features = false }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["buffer", "limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"

[profile.bench]
debug = true
