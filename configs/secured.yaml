# Local API-key policy. The demonstration key is `relay-demo-key`; never reuse it.
listeners:
  - address: 127.0.0.1:8080
    max_connections: 1000
    request_timeout_ms: 10000
    max_header_bytes: 16384

admin:
  enabled: true
  address: 127.0.0.1:9090

routes:
  - name: secured-api
    path_prefix: /
    methods: [GET, POST]
    upstream: secured-api
    authentication:
      type: api_key
      header: x-api-key
    rate_limit:
      requests_per_second: 25
      burst_capacity: 50
      key: api_key
      distributed: false
    max_body_bytes: 1048576
    concurrency_limit: 256

upstreams:
  secured-api:
    endpoints:
      - url: http://127.0.0.1:9001
    load_balancing: round_robin
    connect_timeout_ms: 1000
    concurrency_limit: 512

authentication:
  # sha256("relay-demo-key")
  api_key_sha256:
    - bbff4a4dc5895cc368930102d33b92ad644f6aaa796e912bbdca2e60a2cefe0b
observability:
  log_filter: relay=info
  json_logs: true
redis: null
gateway_rate_limit:
  requests_per_second: 500
  burst_capacity: 1000
  key: route
  distributed: false
shutdown_grace_ms: 15000
