apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: relay
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8443
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
