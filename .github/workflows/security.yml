name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-audit from its published lockfile
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo +stable audit --deny warnings
