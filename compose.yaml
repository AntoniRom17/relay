name: relay-demo

services:
  relay:
    build:
      context: .
      target: runtime
    command: ["/usr/local/bin/relay", "run", "--config", "/etc/relay/docker.yaml"]
    volumes:
      - ./configs/docker.yaml:/etc/relay/docker.yaml:ro
    ports:
      - "8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      - app-a
      - app-b
      - redis
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  app-a:
    build:
      context: .
      target: runtime
    command:
      ["/usr/local/bin/relay-demo", "--listen", "0.0.0.0:9001", "--name", "app-a", "--fail-every", "3"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  app-b:
    build:
      context: .
      target: runtime
    command: ["/usr/local/bin/relay-demo", "--listen", "0.0.0.0:9001", "--name", "app-b"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    read_only: true
    tmpfs: [/data]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=24h"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090"
    depends_on: [relay]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
